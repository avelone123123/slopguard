[package]
name = "slopguard"
version = "3.0.0"
edition = "2021"
authors = ["avelone123123"]
description = "Zero-latency native Rust AI slop and hallucination firewall for Cursor, Claude Code, and vibe-coders"
license = "MIT"
repository = "https://github.com/avelone123123/slopguard"
homepage = "https://avelone123123.github.io/slopguard-site/"
documentation = "https://github.com/avelone123123/slopguard#readme"
readme = "README.md"
[dependencies]
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
walkdir = "2.5"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true